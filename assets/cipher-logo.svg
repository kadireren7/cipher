<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-label="Cipher">
  <title>Cipher</title>
  <style>
    .layer { fill: none; stroke: #6f8fd8; stroke-width: 5; stroke-linejoin: round; }
    .path  { fill: none; stroke: #6f8fd8; stroke-width: 5; stroke-linecap: round; }
    .core  { fill: #6f8fd8; }
    .word  { fill: #1f2328; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 64px; font-weight: 600; letter-spacing: 14px; }
    @media (prefers-color-scheme: dark) { .layer, .path { stroke: #8fa9e8; } .core { fill: #8fa9e8; } .word { fill: #e6edf3; } }
  </style>
  <g transform="translate(0 0)">
    <rect class="layer" x="14" y="14" width="100" height="100" rx="14" opacity="0.45"/>
    <rect class="layer" x="30" y="30" width="68" height="68" rx="10" opacity="0.75"/>
    <rect class="layer" x="46" y="46" width="36" height="36" rx="6"/>
    <rect class="core" x="57" y="57" width="14" height="14" rx="3"/>
    <path class="path" d="M4 64 H22 M22 64 H34 M34 64 H46"/>
  </g>
  <text class="word" x="150" y="84">CIPHER</text>
</svg>
