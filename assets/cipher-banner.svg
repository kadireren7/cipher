<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Cipher: private by protocol, hostile by assumption. Android, OpenMLS, Rust.">
  <title>Cipher: private by protocol, hostile by assumption</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fa9e8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <!-- large mark, right side -->
  <g transform="translate(900 40) scale(2.0)" fill="none" stroke="#8fa9e8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="14" y="14" width="100" height="100" rx="14" opacity="0.30"/>
    <rect x="30" y="30" width="68" height="68" rx="10" opacity="0.55"/>
    <rect x="46" y="46" width="36" height="36" rx="6" opacity="0.9"/>
    <rect x="57" y="57" width="14" height="14" rx="3" fill="#8fa9e8" stroke="none"/>
    <path d="M-60 64 H46" opacity="0.8"/>
  </g>
  <text x="80" y="140" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="84" font-weight="600" letter-spacing="18">CIPHER</text>
  <text x="84" y="196" fill="#9fb3d9" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" letter-spacing="4">PRIVATE BY PROTOCOL. HOSTILE BY ASSUMPTION.</text>
  <text x="84" y="248" fill="#6e7f9e" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="3">ANDROID  /  OPENMLS  /  RUST   -   EXPERIMENTAL, NOT AUDITED</text>
</svg>
