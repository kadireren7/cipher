name: self-hosting acceptance
# Builds the relay container and runs the REAL deployment through install, restart, PostgreSQL restart, backup -> wipe -> restore, and an upgrade from
# the previous release with an old client. Slow (two Rust builds + Docker), so it runs weekly and on demand, not on every push.
# It uses only actions already pinned in ci.yml; it needs no secrets and creates no external resources.
on:
  workflow_dispatch:
    inputs:
      previous_ref:
        description: "git ref of the PREVIOUS release (its relay and client are the 'old' side of the upgrade test)"
        default: main
  schedule:
    - cron: "37 3 * * 1"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: devonly-not-a-secret
        ports: ["55432:5432"]
        options: >-
          --name cipher-pg --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the headless client and the relay (this branch)
        run: cargo build --locked --release -p cipher-relay && cargo build --locked --release -p cipher-ffi --example e2e_peer
      - name: Docker Compose install, restart, PostgreSQL restart, backup/restore, no-downgrade
        run: |
          cd deploy
          export CIPHER_PUBLISH=127.0.0.1:18443
          ./cipherctl.sh init --audience localhost:18443 --tls-self-signed
          ./cipherctl.sh up
          cd ..
          python3 scripts/test-deploy.py localhost:18443
      - name: Upgrade from the previous release (old relay + old client -> this relay, same database)
        run: |
          git worktree add --detach ../previous "${{ github.event.inputs.previous_ref || 'main' }}"
          (cd ../previous && cargo build --locked --release -p cipher-relay --target-dir ../previous-target && cargo build --locked --release -p cipher-ffi --example e2e_peer --target-dir ../previous-target)
          python3 scripts/test-upgrade.py ../previous-target/release/cipher-relay target/release/cipher-relay ../previous-target/release/examples/e2e_peer
