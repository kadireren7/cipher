name: fuzz-smoke

# Time-boxed libFuzzer runs over every parser / security boundary. Nightly toolchain is required by
# cargo-fuzz and is used ONLY here, never for shipped artifacts.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target (120..14400; use 10800 for a three-hour campaign)"
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target:
          - wire_json
          - auth_header
          - mls_snapshot_restore
          - mls_welcome_and_keypackage
          - attachment_decrypt
          - attachment_descriptor
          - filename_and_endpoint
          - app_parsers
          - ffi_validate
          - vault_file
          - privacy_wire
          - history_unseal
          - multi_relay_wire
          - home_log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo +nightly install --locked cargo-fuzz@0.13.2
      - name: Restore persisted corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-${{ github.ref_name }}-
      - name: Fuzz with AddressSanitizer
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '120' }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$FUZZ_SECONDS" =~ ^[0-9]{1,5}$ ]] && (( 10#$FUZZ_SECONDS >= 120 && 10#$FUZZ_SECONDS <= 14400 ))
          mkdir -p campaign
          git rev-parse HEAD > campaign/commit.txt
          rustc +nightly -Vv > campaign/toolchain.txt
          date -u +%FT%TZ > campaign/started.txt
          set +e
          cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time="$FUZZ_SECONDS" 2>&1 | tee campaign/fuzz.txt
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > campaign/exit-status.txt
          date -u +%FT%TZ > campaign/finished.txt
          exit "$status"
      - name: Keep logs, corpus and every crashing input (including successful runs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-evidence-${{ matrix.target }}
          retention-days: 30
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
            fuzz/campaign/
          if-no-files-found: warn
